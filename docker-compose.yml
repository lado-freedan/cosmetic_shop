services:
  db:
    image: postgres:15-alpine
    container_name: cosmetic_postgres
    restart: always
    environment:
      POSTGRES_DB: cosmetic_db
      POSTGRES_USER: cosmetic_user
      POSTGRES_PASSWORD: Miladnazi_68
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: cosmetic_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
    depends_on:
      - db

volumes:
  postgres_data: